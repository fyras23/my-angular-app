<div class="kpi-card" [class.loading]="loading">
  <ng-container *ngIf="loading; else content">
    <div class="skeleton-icon"></div>
    <div class="skeleton-text">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line long"></div>
    </div>
  </ng-container>
  <ng-template #content>
    <div class="kpi-icon-box" [style.background]="iconBg">
      <mat-icon [style.color]="iconColor">{{ icon }}</mat-icon>
    </div>
    <div class="kpi-info">
      <span class="kpi-label">{{ label }}</span>
      <span class="kpi-value">{{ value }}</span>
      <span *ngIf="trend !== null" class="kpi-trend" [class.positive]="trend >= 0" [class.negative]="trend < 0">
        <mat-icon>{{ trend >= 0 ? 'trending_up' : 'trending_down' }}</mat-icon>
        {{ trend >= 0 ? '+' : '' }}{{ trend }}%
      </span>
    </div>
  </ng-template>
</div>
