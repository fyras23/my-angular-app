<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <mat-icon>sports_tennis</mat-icon>
    </div>
    <div class="brand-text" *ngIf="!isCollapsed">
      <span class="brand-name">Padel Analytics</span>
      <span class="brand-tagline">Data That Plays To Win</span>
    </div>
  </div>

  <!-- Toggle -->
  <button class="collapse-btn" (click)="toggle()" [matTooltip]="isCollapsed ? 'Expand' : 'Collapse'" matTooltipPosition="right">
    <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
  </button>

  <!-- Nav -->
  <nav class="sidebar-nav">
    <a
      *ngFor="let item of visibleNavItems; trackBy: trackByRoute"
      class="nav-item"
      [class.active]="isActive(item.route)"
      [routerLink]="item.route"
      [matTooltip]="isCollapsed ? item.label : ''"
      matTooltipPosition="right"
    >
      <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
      <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
    </a>
  </nav>

  <!-- User section -->
  <div class="sidebar-footer">
    <div class="user-info" *ngIf="!isCollapsed">
      <div class="user-avatar">{{ currentUser?.username?.charAt(0)?.toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-name">{{ currentUser?.username }}</span>
        <span class="role-badge" [class.admin]="currentUser?.role === 'admin'">
          {{ currentUser?.role }}
        </span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" [matTooltip]="isCollapsed ? 'Logout' : ''" matTooltipPosition="right">
      <mat-icon>logout</mat-icon>
      <span *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>
</aside>
