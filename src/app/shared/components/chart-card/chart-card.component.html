<div class="chart-card">
  <div class="chart-header">
    <div class="chart-title-row">
      <mat-icon *ngIf="icon" class="chart-icon">{{ icon }}</mat-icon>
      <h3 class="chart-title">{{ title }}</h3>
    </div>
  </div>
  <div class="chart-body" [style.min-height.px]="height">
    <ng-container *ngIf="loading; else chartContent">
      <div class="skeleton-chart" [style.height.px]="height"></div>
    </ng-container>
    <ng-template #chartContent>
      <ng-content></ng-content>
    </ng-template>
  </div>
</div>
