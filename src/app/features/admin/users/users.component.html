<div class="users-page">
  <div class="page-header">
    <h2>User Management</h2>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>person_add</mat-icon>
      Add User
    </button>
  </div>

  <div class="error-banner" *ngIf="error">
    <mat-icon>error_outline</mat-icon>
    <span>{{ error }}</span>
    <button (click)="loadUsers()">Retry</button>
  </div>

  <div class="table-card">
    <div class="loading-overlay" *ngIf="loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <table mat-table [dataSource]="users" class="users-table">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let u">{{ u.id }}</td>
      </ng-container>

      <!-- Username -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let u">
          <div class="user-cell">
            <div class="user-avatar-sm">{{ u.username.charAt(0).toUpperCase() }}</div>
            {{ u.username }}
          </div>
        </td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>

      <!-- Role -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let u">
          <span class="role-badge" [class.admin]="u.role === 'admin'">{{ u.role }}</span>
        </td>
      </ng-container>

      <!-- Dashboard -->
      <ng-container matColumnDef="dashboard">
        <th mat-header-cell *matHeaderCellDef>Dashboard</th>
        <td mat-cell *matCellDef="let u">
          <span
            class="dashboard-chip"
            [style.background]="getDashboardStyle(u.dashboard).bg"
            [style.color]="getDashboardStyle(u.dashboard).color"
          >
            {{ getDashboardLabel(u.dashboard) }}
          </span>
        </td>
      </ng-container>

      <!-- Created At -->
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef>Created At</th>
        <td mat-cell *matCellDef="let u">{{ u.created_at | date:'mediumDate' }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="warn" [disabled]="u.id === currentUserId" (click)="deleteUser(u)" matTooltip="Delete user">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  </div>
</div>
