<!-- Filter Panel -->
<app-filter-panel [config]="filterConfig" (filtersChanged)="onFiltersChanged($event)"></app-filter-panel>

<!-- Error Banner -->
<div class="error-banner" *ngIf="error">
  <mat-icon>error_outline</mat-icon>
  <span>{{ error }}</span>
  <button (click)="loadData()">Retry</button>
</div>

<!-- ROW 1: KPI Cards -->
<div class="kpi-row">
  <app-kpi-card label="Total Players" [value]="totalPlayers" icon="people" iconBg="#E3F2FD" iconColor="#1565C0" [loading]="loading"></app-kpi-card>
  <app-kpi-card label="Men Players" [value]="men" icon="man" iconBg="#E3F2FD" iconColor="#1565C0" [loading]="loading"></app-kpi-card>
  <app-kpi-card label="Women Players" [value]="women" icon="woman" iconBg="#FCE4EC" iconColor="#E91E8C" [loading]="loading"></app-kpi-card>
  <app-kpi-card label="Players Growth" [value]="growthPercent + '%'" icon="trending_up" iconBg="#E8F5E9" iconColor="#2E7D32" [loading]="loading"></app-kpi-card>
</div>

<!-- ROW 2: Player Search -->
<div class="search-section">
  <div class="search-wrap">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      class="search-input"
      placeholder="Search player by name..."
      [value]="searchQuery"
      (input)="onSearch($any($event.target).value)"
      (blur)="showDropdown = false"
      autocomplete="off"
    />
    <mat-spinner *ngIf="searchLoading" diameter="18" class="search-spinner"></mat-spinner>
    <div class="search-dropdown" *ngIf="showDropdown && searchResults.length > 0">
      <div class="search-item" *ngFor="let p of searchResults; trackBy: trackById" (mousedown)="selectPlayer(p)">
        <mat-icon>person</mat-icon>{{ p.name }}
      </div>
    </div>
  </div>
  <div class="player-stats" *ngIf="selectedPlayer">
    <span class="stat-badge"><strong>{{ selectedPlayer.name }}</strong></span>
    <span class="stat-badge">Matches: <strong>{{ selectedPlayer.matches }}</strong></span>
    <span class="stat-badge">Wins: <strong>{{ selectedPlayer.wins }}</strong></span>
    <span class="stat-badge">Points: <strong>{{ selectedPlayer.points }}</strong></span>
  </div>
</div>

<!-- ROW 3: Top 10 + Top 3 -->
<div class="row-2">
  <div>
    <app-chart-card title="Top 10 Players by Match Wins" icon="leaderboard" [height]="340" [loading]="loading">
      <canvas id="top10Chart" height="340"></canvas>
    </app-chart-card>
  </div>
  <div>
    <app-chart-card title="Top 3 Players Overview" icon="bar_chart" [height]="340" [loading]="loading">
      <canvas id="top3Chart" height="340"></canvas>
    </app-chart-card>
  </div>
</div>

<!-- ROW 4: Radar + Gauges -->
<div class="row-3">
  <div class="col-5">
    <app-chart-card title="Player Match Performance Overview" icon="radar" [height]="300" [loading]="loading">
      <canvas id="radarChart" height="300"></canvas>
    </app-chart-card>
  </div>
  <div class="col-4">
    <app-chart-card title="Consistency Score" icon="verified" [height]="300" [loading]="loading">
      <app-gauge-chart [value]="consistency" label="Consistency" color="#1565C0" [loading]="loading"></app-gauge-chart>
    </app-chart-card>
  </div>
  <div class="col-3">
    <app-chart-card title="Players Growth %" icon="trending_up" [height]="300" [loading]="loading">
      <app-gauge-chart [value]="growthPercent" label="Growth %" color="#2E7D32" [loading]="loading"></app-gauge-chart>
    </app-chart-card>
  </div>
</div>
